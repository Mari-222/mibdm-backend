spring.application.name=mibdm-backend
server.port=8080

# Conexion a MySQL (Docker: ver docker-compose.yml, puerto 3307 en tu maquina)
# Se pueden sobreescribir con variables de entorno: DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/MiBDM?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root1234}

spring.jackson.serialization.write-dates-as-timestamps=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
